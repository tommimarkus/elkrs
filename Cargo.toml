[workspace]
members = [
  "crates/elkrs-core",
  "crates/elkrs-json",
  "crates/elkrs-layered",
  "tools/visual-parity",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "EPL-2.0"
repository = "https://github.com/tommimarkus/elkrs"

[workspace.dependencies]
indexmap = "2.8.0"
serde = "1"
serde_json = "1"
thiserror = "2.0.12"
