name: Release Evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo doc --workspace --locked --no-deps
      - name: Install release evidence tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-cyclonedx --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Record source file manifests
        run: |
          mkdir -p target/release-evidence
          git ls-files > target/release-evidence/elkrs-source-files.txt
          git ls-files crates/elkrs-core Cargo.lock Cargo.toml README.md LICENSE \
            > target/release-evidence/elkrs-core-source-files.txt
          git ls-files crates/elkrs-json Cargo.lock Cargo.toml README.md LICENSE \
            > target/release-evidence/elkrs-json-source-files.txt
          git ls-files crates/elkrs-layered Cargo.lock Cargo.toml README.md LICENSE \
            > target/release-evidence/elkrs-layered-source-files.txt
      - name: Generate CycloneDX SBOMs
        run: cargo cyclonedx --format json --spec-version 1.5
      - name: Collect release evidence
        run: |
          cp crates/elkrs-core/elkrs-core.cdx.json target/release-evidence/elkrs-core-bom.json
          cp crates/elkrs-json/elkrs-json.cdx.json target/release-evidence/elkrs-json-bom.json
          cp crates/elkrs-layered/elkrs-layered.cdx.json target/release-evidence/elkrs-layered-bom.json
          cargo metadata --locked --format-version 1 > target/release-evidence/cargo-metadata.json
          (cd target/release-evidence && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: target/release-evidence/
          if-no-files-found: error
